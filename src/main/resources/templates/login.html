<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Smart Refrigerator</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-body"><main class="auth-shell"><section class="auth-aside"><a class="brand-lockup" href="/"><span class="brand-icon">◉</span><span data-i18n="brandName">Fridge</span></a><div class="auth-aside-copy"><span class="eyebrow" data-i18n="authEyebrow">SMART REFRIGERATOR</span><h2 data-i18n="loginSubtitle">Your kitchen, thoughtfully organised.</h2><p data-i18n="brandTagline">A little more clarity in your kitchen.</p></div><div class="aside-orbit orbit-one"></div><div class="aside-orbit orbit-two"></div><span class="aside-leaf">✳</span></section><section class="auth-content"><div class="auth-content-top"><span class="auth-mobile-brand"><span class="brand-icon">◉</span><span data-i18n="brandName">Fridge</span></span><select id="languageSelect" aria-label="Language" data-i18n-aria="preferredLanguage"><option value="ja">日本語</option><option value="en">English</option></select></div><div class="auth-form-wrap"><p class="eyebrow" data-i18n="authEyebrow">SMART REFRIGERATOR</p><h1 data-i18n="loginTitle">おかえりなさい</h1><p class="auth-subtitle" data-i18n="loginSubtitle">キッチンの食材を、すっきり管理。</p><div th:if="${param.error}" class="alert-danger" data-i18n="loginError">ユーザー名またはパスワードが正しくありません。</div><div th:if="${param.signup_success}" class="success-msg" data-i18n="signupSuccess">登録が完了しました。ログインしてください。</div><div th:if="${param.password_reset}" class="success-msg" data-i18n="resetSuccess">パスワードを更新しました。ログインしてください。</div><form th:action="@{/login}" method="post"><div class="form-group"><label for="username" data-i18n="username">ユーザー名</label><input id="username" type="text" name="username" required autocomplete="username" placeholder="ユーザー名を入力" data-i18n-placeholder="usernamePlaceholder"></div><div class="form-group"><label for="password" data-i18n="password">パスワード</label><input id="password" type="password" name="password" required autocomplete="current-password" placeholder="パスワードを入力" data-i18n-placeholder="passwordPlaceholder"></div><div class="auth-action-row"><a th:href="@{/forgot-password}" data-i18n="forgotLink">パスワードをお忘れですか？</a></div><button type="submit" class="primary-button" data-i18n="loginButton">ログイン</button></form><p class="auth-footer"><span data-i18n="noAccount">はじめてご利用ですか？</span> <a th:href="@{/signup}" data-i18n="registerLink">アカウントを作成</a></p></div><p class="auth-legal" data-i18n="brandTagline">キッチンに、少しのゆとりを。</p></section></main><script src="/js/i18n.js"></script></body></html>
