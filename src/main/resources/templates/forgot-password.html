<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Smart Refrigerator</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-body"><main class="auth-shell"><section class="auth-aside"><a class="brand-lockup" href="/"><span class="brand-icon">◉</span><span data-i18n="brandName">Fridge</span></a><div class="auth-aside-copy"><span class="eyebrow" data-i18n="authEyebrow">SMART REFRIGERATOR</span><h2 data-i18n="recoverTitle">パスワードを再設定</h2><p data-i18n="brandTagline">キッチンに、少しのゆとりを。</p></div><div class="aside-orbit orbit-one"></div><div class="aside-orbit orbit-two"></div><span class="aside-leaf">✳</span></section><section class="auth-content"><div class="auth-content-top"><span class="auth-mobile-brand"><span class="brand-icon">◉</span><span data-i18n="brandName">Fridge</span></span><select id="languageSelect" aria-label="Language" data-i18n-aria="preferredLanguage"><option value="ja">日本語</option><option value="en">English</option></select></div><div class="auth-form-wrap"><p class="eyebrow" data-i18n="authEyebrow">SMART REFRIGERATOR</p><h1 data-i18n="recoverTitle">パスワードを再設定</h1><p class="auth-subtitle" data-i18n="recoverIntro">登録したメールアドレスを入力してください。登録済みの場合、確認コードを送信します。</p><div th:if="${errorMessage}" class="alert-danger" data-i18n-error th:text="${errorMessage}"></div><div th:if="${sent}" class="success-msg" data-i18n="otpSent">確認コードをメールで送信しました。</div><form th:action="@{/forgot-password}" method="post"><div class="form-group"><label for="email" data-i18n="email">メールアドレス</label><input id="email" type="email" name="email" required autocomplete="email" th:value="${email}" placeholder="you@example.com" data-i18n-placeholder="emailPlaceholder"></div><button type="submit" class="primary-button" data-i18n="sendOtp">確認コードを送信</button></form><form th:action="@{/reset-password}" method="post" class="reset-form"><div class="form-group"><label for="resetEmail" data-i18n="email">メールアドレス</label><input id="resetEmail" type="email" name="email" required th:value="${email}" placeholder="you@example.com" data-i18n-placeholder="emailPlaceholder"></div><div class="form-group"><label for="code" data-i18n="otpCode">確認コード</label><input id="code" type="text" name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6桁の確認コード" data-i18n-placeholder="otpPlaceholder"></div><div class="form-group"><label for="password" data-i18n="newPassword">新しいパスワード</label><input id="password" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="8文字以上で入力" data-i18n-placeholder="newPasswordPlaceholder"></div><button type="submit" class="primary-button" data-i18n="resetButton">パスワードを更新</button></form><p class="auth-footer"><a th:href="@{/login}" data-i18n="backLogin">ログインに戻る</a></p></div><p class="auth-legal" data-i18n="brandTagline">キッチンに、少しのゆとりを。</p></section></main><script src="/js/i18n.js"></script></body></html>
