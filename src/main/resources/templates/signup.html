<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Smart Refrigerator</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-body"><main class="auth-shell"><section class="auth-aside"><a class="brand-lockup" href="/"><span class="brand-icon">◉</span><span data-i18n="brandName">Fridge</span></a><div class="auth-aside-copy"><span class="eyebrow" data-i18n="authEyebrow">SMART REFRIGERATOR</span><h2 data-i18n="registerSubtitle">A calmer way to keep track of what you have.</h2><p data-i18n="brandTagline">A little more clarity in your kitchen.</p></div><div class="aside-orbit orbit-one"></div><div class="aside-orbit orbit-two"></div><span class="aside-leaf">✳</span></section><section class="auth-content"><div class="auth-content-top"><span class="auth-mobile-brand"><span class="brand-icon">◉</span><span data-i18n="brandName">Fridge</span></span><select id="languageSelect" aria-label="Language" data-i18n-aria="preferredLanguage"><option value="ja">日本語</option><option value="en">English</option></select></div><div class="auth-form-wrap"><p class="eyebrow" data-i18n="authEyebrow">SMART REFRIGERATOR</p><h1 data-i18n="registerTitle">アカウントを作成</h1><p class="auth-subtitle" data-i18n="registerSubtitle">冷蔵庫の中身を、もっとわかりやすく。</p><div th:if="${errorMessage}" class="alert-danger" data-i18n-error th:text="${errorMessage}"></div><form th:action="@{/signup}" method="post"><div class="form-group"><label for="username" data-i18n="username">ユーザー名</label><input id="username" type="text" name="username" required minlength="3" maxlength="40" autocomplete="username" th:value="${typedUsername}" placeholder="ユーザー名を入力" data-i18n-placeholder="usernamePlaceholder"></div><div class="form-group"><label for="email" data-i18n="email">メールアドレス</label><input id="email" type="email" name="email" required autocomplete="email" th:value="${typedEmail}" placeholder="you@example.com" data-i18n-placeholder="emailPlaceholder"></div><div class="form-group"><label for="password" data-i18n="password">パスワード</label><input id="password" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="8文字以上で入力" data-i18n-placeholder="newPasswordPlaceholder"><small data-i18n="passwordHelp">8文字以上で入力してください。</small></div><button type="submit" class="primary-button" data-i18n="createAccount">アカウントを作成</button></form><p class="auth-footer"><span data-i18n="haveAccount">すでにアカウントをお持ちですか？</span> <a th:href="@{/login}" data-i18n="backLogin">ログインに戻る</a></p></div><p class="auth-legal" data-i18n="brandTagline">キッチンに、少しのゆとりを。</p></section></main><script src="/js/i18n.js"></script></body></html>
